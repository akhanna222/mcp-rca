[pytest]
# Pytest configuration for MCP-RCA platform

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Enable strict markers
    --strict-markers
    # Code coverage
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    # Coverage threshold
    --cov-fail-under=80
    # Async support
    --asyncio-mode=auto

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slower, may need external services)
    slow: Slow tests
    gcp: Tests that require GCP credentials
    aws: Tests that require AWS credentials
    azure: Tests that require Azure credentials

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
